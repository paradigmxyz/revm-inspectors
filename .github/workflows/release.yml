name: Release

permissions: {}

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    if: github.repository == 'paradigmxyz/revm-inspectors'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # secure-runner only: crates.io trusts only the crates-io environment.
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@763efe11a9d8333bcbf0bb2f5ab80f21961c48fd # 2026-11-02T08-44-18Z-763efe11
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tagged commit is on main or a backport-vN branch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git branch -r --format='%(refname:short)' --contains "$GITHUB_SHA" | grep -E '^origin/(main|backport-v[0-9]+)$'
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@763efe11a9d8333bcbf0bb2f5ab80f21961c48fd # 2026-11-02T08-44-18Z-763efe11
        with:
          toolchain: 1.99.1
      - name: Check the tag matches the crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[] | select(.name == "revm-inspectors") | .version')"
          test "$TAG" = "v${version}"
      - uses: tempoxyz/gh-actions/actions/cargo-publish@763efe11a9d8333bcbf0bb2f5ab80f21961c48fd # 2026-11-02T08-44-18Z-763efe11
        with:
          packages: revm-inspectors
          dry-run: true

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@763efe11a9d8333bcbf0bb2f5ab80f21961c48fd # 2026-11-02T08-44-18Z-763efe11
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@763efe11a9d8333bcbf0bb2f5ab80f21961c48fd # 2026-11-02T08-44-18Z-763efe11
        with:
          toolchain: 1.99.1
      - name: Check the tag still points at the verified commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          target="$(git ls-remote --tags origin | awk -v r="refs/tags/${TAG}" '$2 == r { t = $1 } $2 == r "^{}" { p = $1 } END { print (p != "" ? p : t) }')"
          test "$target" = "$GITHUB_SHA"
      - uses: tempoxyz/gh-actions/actions/cargo-publish@763efe11a9d8333bcbf0bb2f5ab80f21961c48fd # 2026-11-02T08-44-18Z-763efe11
        with:
          packages: revm-inspectors
          verify: false
