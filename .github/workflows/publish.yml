name: Publish crates

permissions: {}

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    if: github.repository == 'paradigmxyz/revm-inspectors'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # secure-runner only: crates.io trusts only the release environment.
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@763efe11a9d8333bcbf0bb2f5ab80f21961c48fd # 2026-11-02T08-44-18Z-763efe11
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Not a security boundary: a tag runs the workflow file at its own commit, so the
      # tag ruleset and the release environment's required reviewers gate publishing.
      - name: Check the tagged commit is on main or a backport branch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for branch in refs/remotes/origin/main $(git for-each-ref --format='%(refname)' refs/remotes/origin | grep backport || true); do
            if git merge-base --is-ancestor "$GITHUB_SHA" "$branch"; then
              echo "release commit is on ${branch#refs/remotes/origin/}"
              exit 0
            fi
          done
          echo "error: ${GITHUB_SHA} is not on main or a backport branch" >&2
          exit 1
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@763efe11a9d8333bcbf0bb2f5ab80f21961c48fd # 2026-11-02T08-44-18Z-763efe11
        with:
          toolchain: 1.99.1
      - name: Resolve packages
        id: packages
        env:
          TAG: ${{ github.ref_name }}
        run: .github/scripts/release-packages.sh "$TAG" >> "$GITHUB_OUTPUT"
      - uses: tempoxyz/gh-actions/actions/cargo-publish@763efe11a9d8333bcbf0bb2f5ab80f21961c48fd # 2026-11-02T08-44-18Z-763efe11
        with:
          packages: ${{ steps.packages.outputs.packages }}
          dry-run: true

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@763efe11a9d8333bcbf0bb2f5ab80f21961c48fd # 2026-11-02T08-44-18Z-763efe11
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@763efe11a9d8333bcbf0bb2f5ab80f21961c48fd # 2026-11-02T08-44-18Z-763efe11
        with:
          toolchain: 1.99.1
      - name: Check the tag still points at the verified commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          target="$(git ls-remote --tags origin | awk -v r="refs/tags/${TAG}" '$2 == r { t = $1 } $2 == r "^{}" { p = $1 } END { print (p != "" ? p : t) }')"
          test "$target" = "$GITHUB_SHA"
      - uses: tempoxyz/gh-actions/actions/cargo-publish@763efe11a9d8333bcbf0bb2f5ab80f21961c48fd # 2026-11-02T08-44-18Z-763efe11
        with:
          packages: ${{ needs.verify.outputs.packages }}
          verify: false

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag still points at the verified commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          target="$(git ls-remote --tags origin | awk -v r="refs/tags/${TAG}" '$2 == r { t = $1 } $2 == r "^{}" { p = $1 } END { print (p != "" ? p : t) }')"
          test "$target" = "$GITHUB_SHA"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists"
            exit 0
          fi
          prev="$(git describe --tags --abbrev=0 --match "v*" "${TAG}^" 2>/dev/null || true)"
          args=(--verify-tag --generate-notes --title "${TAG}")
          version="${TAG#v}"
          version="${version%%+*}"
          if [[ "$version" == *-* ]]; then
            args+=(--prerelease)
          fi
          # Backport releases must not become the repository's latest release.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            args+=(--latest=false)
          fi
          if [[ -n "$prev" ]]; then
            args+=(--notes-start-tag "$prev")
          fi
          gh release create "$TAG" "${args[@]}"
